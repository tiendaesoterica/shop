<!DOCTYPE html>
<html lang="es-AR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base:             'rgb(var(--color-base) / <alpha-value>)',
                        surface:          'rgb(var(--color-surface) / <alpha-value>)',
                        surfaceHighlight: 'rgb(var(--color-surface-highlight) / <alpha-value>)',
                        accent:           'rgb(var(--color-accent) / <alpha-value>)',
                        accentHover:      '#FBBF24',
                        textMain:         '#FFFFFF',
                        textMuted:        '#E2E8F0',
                        success:          '#10B981',
                        danger:           '#E11D48',
                        warning:          '#F59E0B',
                        darkLux:          '#05030A',
                    },
                    fontFamily: {
                        sans:    ['Inter', 'sans-serif'],
                        heading: ['Cinzel', 'serif'],
                    },
                    animation: {
                        'mystic-pulse': 'mysticPulse 4s infinite alternate',
                        'fade-up':      'fadeUp 0.7s ease-out forwards',
                    },
                    keyframes: {
                        mysticPulse: {
                            '0%':   { opacity: '0.3', transform: 'scale(1)' },
                            '100%': { opacity: '0.7', transform: 'scale(1.05)' },
                        },
                        fadeUp: {
                            '0%':   { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        .btn-primary {
            @apply bg-surfaceHighlight/50 backdrop-blur-md text-textMain py-3.5 px-8 rounded-lg text-xs uppercase tracking-[0.2em] font-bold hover:bg-accent hover:text-darkLux transition-all duration-500 text-center shadow-[0_0_15px_rgba(var(--color-accent),0.2)] border border-white/10 hover:border-accent;
        }
        .glass-panel {
            @apply bg-surface/40 backdrop-blur-2xl border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.5)];
        }
        .hub-item-card {
            @apply bg-surface/30 backdrop-blur-xl border border-white/10 rounded-xl transition-all duration-500 hover:-translate-y-2 hover:border-accent/50 hover:shadow-[0_15px_40px_rgba(0,0,0,0.6)] relative overflow-hidden cursor-pointer;
        }
        .store-input {
            @apply w-full bg-surface/30 backdrop-blur-md border border-white/10 text-sm text-textMain px-4 py-3.5 rounded-lg focus:outline-none focus:border-accent/80 focus:ring-1 focus:ring-accent/80 transition-all duration-300 placeholder-textMuted/50 shadow-inner;
        }
        /* tag badge */
        .badge {
            @apply inline-flex items-center gap-1 text-[8px] uppercase tracking-[0.15em] font-bold px-2 py-0.5 rounded-full border;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgb(var(--color-accent)); }
    </style>

    <style>
        :root {
            --color-base: 13 9 20;
            --color-surface: 26 17 42;
            --color-surface-highlight: 45 29 69;
            --color-accent: 212 175 55;
            --overlay-opacity: 0.8;
            --hub-accent: 212 175 55; /* se sobreescribe desde hub.color_acento */
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgb(var(--color-accent)); }
        [x-cloak] { display: none !important; }

        body {
            background-color: rgb(var(--color-base));
            background-image: radial-gradient(circle at 50% 0%, rgba(var(--color-surface), 0.8) 0%, rgba(var(--color-base), 1) 100%);
            background-attachment: fixed;
        }

        #tsparticles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        /* Línea decorativa del hub con color dinámico */
        .hub-accent-line {
            background: linear-gradient(90deg, transparent, rgb(var(--hub-accent)), transparent);
        }
        .hub-accent-glow {
            box-shadow: 0 0 40px 0 rgba(var(--hub-accent), 0.25);
        }

        /* Grid masonry-style para items */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }
        @media (max-width: 640px) {
            .items-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        }

        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Precio tachado */
        .price-original { text-decoration: line-through; opacity: 0.5; }
    </style>

    <!-- Anti-flash de tema -->
    <script>
        (function() {
            try {
                const hexToRgb = h => {
                    if (!h) return '0 0 0';
                    let c = h.substring(1);
                    if (c.length === 3) c = c.split('').map(x => x+x).join('');
                    return `${parseInt(c.slice(0,2),16)} ${parseInt(c.slice(2,4),16)} ${parseInt(c.slice(4,6),16)}`;
                };
                const presets = {
                    default: { base:'#0D0914', surface:'#1A112A', accent:'#D4AF37', highlight:'#2D1D45' },
                    dragon:  { base:'#140505', surface:'#210A0A', accent:'#E11D48', highlight:'#331212' },
                    forest:  { base:'#05120B', surface:'#092215', accent:'#10B981', highlight:'#113623' },
                    ocean:   { base:'#050A14', surface:'#0A1326', accent:'#3B82F6', highlight:'#122240' },
                };
                const t = localStorage.getItem('nexus_theme') || 'default';
                const p = presets[t] || presets.default;
                document.documentElement.style.setProperty('--color-base',             hexToRgb(t==='custom' ? localStorage.getItem('nexus_color_base')    || p.base    : p.base));
                document.documentElement.style.setProperty('--color-surface',          hexToRgb(t==='custom' ? localStorage.getItem('nexus_color_surface') || p.surface : p.surface));
                document.documentElement.style.setProperty('--color-surface-highlight',hexToRgb(p.highlight));
                document.documentElement.style.setProperty('--color-accent',           hexToRgb(t==='custom' ? localStorage.getItem('nexus_color_accent')  || p.accent  : p.accent));
            } catch(e){}
        })();
    </script>
</head>

<body class="text-textMuted font-sans antialiased min-h-screen flex flex-col relative selection:bg-accent/30 selection:text-textMain overflow-x-hidden"
      x-data="hubPage()"
      x-init="init()"
      :class="(isLoading || fullscreenImage || isAuthModalOpen) ? 'overflow-hidden' : ''">

    <!-- Partículas -->
    <div id="tsparticles"></div>

    <!-- ═══════════════════════════════════════════════════
         PANTALLA DE CARGA
    ═══════════════════════════════════════════════════ -->
    <div x-show="isLoading"
         x-transition:leave="transition ease-in duration-700"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[200] bg-base flex flex-col items-center justify-center backdrop-blur-2xl">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surfaceHighlight/30 via-base to-base pointer-events-none"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[60vw] h-[60vw] max-w-2xl bg-accent/5 rounded-full blur-[80px] pointer-events-none animate-mystic-pulse"></div>
        <div class="relative z-10 flex flex-col items-center animate-mystic-pulse">
            <template x-if="settings.logo_url">
                <img :src="settings.logo_url" class="h-20 w-auto object-contain mb-6 drop-shadow-[0_0_15px_rgba(var(--color-accent),0.3)]">
            </template>
            <template x-if="!settings.logo_url">
                <svg class="h-16 w-16 text-accent mb-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2v20M17 5l-10 14M22 12H2M19 17L5 7"/>
                </svg>
            </template>
            <div class="flex items-center gap-3 mt-2">
                <svg class="animate-spin h-4 w-4 text-accent" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span class="text-[10px] uppercase tracking-[0.35em] font-bold text-textMuted">Abriendo portal...</span>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════
         NAVBAR  (idéntico al index)
    ═══════════════════════════════════════════════════ -->
    <header x-show="!isLoading" x-cloak
            class="fixed top-0 w-full z-50 transition-all duration-500"
            x-data="{ scrolled: false, mobileOpen: false }"
            @scroll.window="scrolled = window.pageYOffset > 20"
            :class="(scrolled || mobileOpen) ? 'bg-surface/60 backdrop-blur-xl shadow-[0_4px_30px_rgba(0,0,0,0.5)] border-b border-white/10 py-3' : 'bg-transparent py-5'">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-between items-center relative z-50">

            <!-- Logo / Nombre -->
            <a href="/index.html" class="flex items-center gap-3 group">
                <template x-if="settings.logo_url">
                    <img :src="settings.logo_url" class="h-9 w-auto object-contain transition-transform duration-500 group-hover:scale-110">
                </template>
                <template x-if="!settings.logo_url">
                    <svg class="h-7 w-7 text-accent group-hover:scale-110 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2v20M17 5l-10 14M22 12H2M19 17L5 7"/>
                    </svg>
                </template>
                <span class="text-lg font-heading font-bold tracking-[0.2em] text-textMain group-hover:text-accent transition-colors hidden sm:block"
                      x-show="!settings.logo_url" x-text="settings.site_name"></span>
            </a>

            <!-- Nav centro: nombre del hub + breadcrumb -->
            <div class="hidden lg:flex items-center gap-2 bg-surface/30 backdrop-blur-xl px-6 py-2.5 rounded-full border border-white/10">
                <a href="/index.html" class="text-[10px] uppercase tracking-[0.2em] font-medium text-textMuted hover:text-white transition-colors">Inicio</a>
                <span class="text-white/20 text-xs">›</span>
                <button @click="openHubView()" class="text-[10px] uppercase tracking-[0.2em] font-medium transition-colors"
                        :class="currentView === 'hub' ? 'text-accent pointer-events-none' : 'text-textMuted hover:text-white'"
                        x-text="hub ? hub.nombre : '...'"></button>
                <template x-if="currentView === 'category' && currentCategory">
                    <span class="flex items-center gap-2">
                        <span class="text-white/20 text-xs">›</span>
                        <span class="text-[10px] uppercase tracking-[0.2em] font-medium text-accent truncate max-w-[160px]" x-text="currentCategory.nombre"></span>
                    </span>
                </template>
                <template x-if="currentView === 'item' && currentItem">
                    <span class="flex items-center gap-2">
                        <template x-if="currentCategory">
                            <span class="flex items-center gap-2">
                                <span class="text-white/20 text-xs">›</span>
                                <button @click="openCategoryView(currentCategory)"
                                        class="text-[10px] uppercase tracking-[0.2em] font-medium text-textMuted hover:text-white transition-colors truncate max-w-[120px]"
                                        x-text="currentCategory.nombre"></button>
                            </span>
                        </template>
                        <span class="text-white/20 text-xs">›</span>
                        <span class="text-[10px] uppercase tracking-[0.2em] font-medium text-textMuted truncate max-w-[160px]" x-text="currentItem.nombre"></span>
                    </span>
                </template>
            </div>

            <!-- Derecha: auth + volver al hub si estamos en item -->
            <div class="flex items-center gap-3">
                <!-- Botón volver (solo en vista category o item) -->
                <button x-show="currentView === 'item' || currentView === 'category'" x-cloak
                        @click="currentView === 'item' && currentCategory ? openCategoryView(currentCategory) : openHubView()"
                        class="hidden sm:flex items-center gap-2 text-[10px] uppercase tracking-widest font-bold text-textMuted hover:text-accent border border-white/10 hover:border-accent/50 px-4 py-2 rounded-full transition-all backdrop-blur-md bg-surface/30">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    <span x-text="currentView === 'item' && currentCategory ? currentCategory.nombre : (hub ? hub.nombre : 'Ver todo')"></span>
                </button>

                <!-- Burger móvil -->
                <button @click="mobileOpen = !mobileOpen" class="lg:hidden text-textMain hover:text-accent transition-colors">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
                        <path x-show="mobileOpen"  stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" x-cloak/>
                    </svg>
                </button>

                <!-- Auth button -->
                <button @click="openAuthModal()"
                        class="relative p-2.5 rounded-full transition-all duration-300 hover:scale-105 border border-white/10 hover:border-accent hover:text-accent backdrop-blur-md"
                        :class="(scrolled || mobileOpen) ? 'bg-surface/50 text-textMuted' : 'bg-surfaceHighlight/30 text-textMain'">
                    <svg x-show="!authUser" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <div x-show="authUser" x-cloak
                         class="w-5 h-5 flex items-center justify-center rounded-full text-[10px] font-bold text-darkLux"
                         :class="userAccessMap.is_vip ? 'bg-accent shadow-[0_0_8px_rgba(var(--color-accent),0.9)]' : 'bg-accent'">
                        <span x-show="!userAccessMap.is_vip" x-text="authUser?.email?.charAt(0).toUpperCase()"></span>
                        <span x-show="userAccessMap.is_vip" class="text-[8px]">★</span>
                    </div>
                    <!-- Dot admin -->
                    <span x-show="authUser && canAccessAdmin" x-cloak
                          class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-accent border border-darkLux shadow-[0_0_6px_rgba(var(--color-accent),0.8)]"></span>
                </button>
            </div>
        </div>

        <!-- Mobile menu -->
        <div x-show="mobileOpen" @click.away="mobileOpen = false" x-cloak
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 -translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-4"
             class="lg:hidden absolute top-full left-0 w-full bg-surface/80 backdrop-blur-2xl border-b border-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.6)]">
            <div class="px-6 py-6 flex flex-col space-y-4 text-center">
                <a href="/index.html" class="text-sm uppercase tracking-[0.2em] font-heading font-bold text-textMain hover:text-accent">← Inicio</a>
                <button @click="openHubView(); mobileOpen=false"
                        class="text-sm uppercase tracking-[0.2em] font-heading font-bold text-textMuted hover:text-accent"
                        x-text="hub ? hub.nombre : ''"></button>
                <button x-show="currentView === 'category' && currentCategory" x-cloak
                        class="text-sm uppercase tracking-[0.2em] font-heading font-bold text-accent"
                        x-text="currentCategory ? currentCategory.nombre : ''"></button>
                <button x-show="currentView === 'item' && currentCategory" x-cloak
                        @click="openCategoryView(currentCategory); mobileOpen=false"
                        class="text-sm uppercase tracking-[0.2em] font-heading font-bold text-textMuted hover:text-accent"
                        x-text="currentCategory ? '← ' + currentCategory.nombre : ''"></button>
                <button x-show="currentView === 'item' && !currentCategory" x-cloak
                        @click="openHubView(); mobileOpen=false"
                        class="text-sm uppercase tracking-[0.2em] font-heading font-bold text-textMuted hover:text-accent">
                    Ver todos los items
                </button>
                <template x-if="canAccessAdmin">
                    <a href="/admin.html" class="text-sm uppercase tracking-[0.2em] font-heading font-bold text-accent/70 hover:text-accent">Panel Admin</a>
                </template>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════
         MAIN — tres vistas: HUB / CATEGORY / ITEM
    ═══════════════════════════════════════════════════ -->
    <main x-show="!isLoading" x-cloak class="flex flex-col flex-grow w-full relative z-10">

        <!-- ─── VISTA: PÁGINA DEL HUB (portada + grid items) ─── -->
        <div x-show="currentView === 'hub'" x-transition.opacity>

            <!-- ── HERO DEL HUB ── -->
            <section class="relative w-full min-h-[70vh] flex items-end overflow-hidden bg-base">

                <!-- Imagen de portada -->
                <template x-if="hub && hub.portada_url">
                    <div class="absolute inset-0 bg-cover bg-center transition-all duration-1000"
                         :style="`background-image: url('${hub.portada_url}')`"></div>
                </template>

                <!-- Overlay degradado -->
                <div class="absolute inset-0 bg-gradient-to-b from-base/40 via-base/50 to-base z-10 pointer-events-none"></div>

                <!-- Glow ambiental con el color acento del hub -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[70vw] h-[70vw] max-w-3xl rounded-full pointer-events-none blur-[120px] animate-mystic-pulse z-10"
                     style="background: radial-gradient(circle, rgba(var(--hub-accent),0.18) 0%, transparent 70%)"></div>

                <!-- Contenido Hero -->
                <div class="relative z-20 w-full max-w-7xl mx-auto px-6 pb-16 pt-36">

                    <!-- Tipo badge -->
                    <template x-if="hub">
                        <div class="flex items-center gap-3 mb-5">
                            <span class="text-[9px] uppercase tracking-[0.35em] font-bold px-3 py-1 rounded-full border"
                                  style="color: rgb(var(--hub-accent)); border-color: rgba(var(--hub-accent),0.4); background: rgba(var(--hub-accent),0.1)"
                                  x-text="hub.tipo"></span>
                            <div class="h-px flex-grow max-w-[80px]" style="background: linear-gradient(90deg, rgba(var(--hub-accent),0.5), transparent)"></div>
                        </div>
                    </template>

                    <h1 class="text-5xl md:text-7xl font-heading font-bold text-textMain leading-tight drop-shadow-[0_5px_20px_rgba(0,0,0,0.9)] mb-5 animate-fade-up"
                        x-text="hub ? hub.nombre : ''"></h1>

                    <p class="text-base md:text-lg text-textMain/80 max-w-2xl font-light leading-relaxed drop-shadow-md animate-fade-up mb-8"
                       x-text="hub ? hub.descripcion : ''"></p>

                    <!-- Stats rápidas -->
                    <template x-if="hub && items.length > 0">
                        <div class="flex items-center gap-6 mt-2">
                            <div class="flex items-center gap-2">
                                <span class="text-2xl font-heading font-bold" style="color: rgb(var(--hub-accent))" x-text="items.length"></span>
                                <span class="text-[10px] uppercase tracking-widest font-bold text-textMuted">
                                    <span x-text="items.length === 1 ? 'item' : 'items'"></span>
                                </span>
                            </div>
                            <div class="w-px h-6 bg-white/10"></div>
                            <div class="flex items-center gap-2">
                                <span class="text-2xl font-heading font-bold text-textMain"
                                      x-text="items.filter(i => i.estado === 'publicado').length"></span>
                                <span class="text-[10px] uppercase tracking-widest font-bold text-textMuted">publicados</span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Línea inferior con color del hub -->
                <div class="absolute bottom-0 left-0 right-0 h-px z-20 hub-accent-line"></div>
            </section>

            <!-- ── FILTROS + BÚSQUEDA ── -->
            <section class="sticky top-[60px] md:top-[80px] z-40 bg-base/80 backdrop-blur-2xl border-b border-white/5">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">

                    <!-- Search -->
                    <div class="relative flex-1 max-w-sm">
                        <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-textMuted/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
                        </svg>
                        <input type="text" x-model="searchQuery"
                               placeholder="Buscar en este hub..."
                               class="store-input !py-2 !pl-10 !text-xs !bg-surface/20">
                        <button x-show="searchQuery" @click="searchQuery=''"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-textMuted/40 hover:text-white transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <!-- Filtro por tipo_item -->
                    <div class="flex items-center gap-2 overflow-x-auto scrollbar-hide pb-0.5 sm:pb-0">
                        <button @click="filterTipo = 'todos'"
                                class="flex-shrink-0 px-3 py-1.5 rounded-full text-[9px] uppercase tracking-widest font-bold border transition-all"
                                :class="filterTipo === 'todos' ? 'bg-white/10 border-white/30 text-white' : 'border-white/10 text-textMuted hover:border-white/20 hover:text-white'">
                            Todos
                        </button>
                        <template x-for="tipo in tiposDisponibles" :key="tipo">
                            <button @click="filterTipo = tipo"
                                    class="flex-shrink-0 px-3 py-1.5 rounded-full text-[9px] uppercase tracking-widest font-bold border transition-all"
                                    :class="filterTipo === tipo

                                        activeImage: 0,
                                        autoSlide: null,
                                        get currentImages() {
                                            if (!linkedProduct) return [];
                                            return linkedProduct.images && linkedProduct.images.length > 0 ? linkedProduct.images.slice(0, 3) : [linkedProduct.image];
                                        },
                                        startAutoSlide() {
                                            this.stopAutoSlide();
                                            if (this.currentImages.length > 1) {
                                                this.autoSlide = setInterval(() => { this.nextImage(true); }, 4000);
                                            }
                                        },
                                        stopAutoSlide() {
                                            if (this.autoSlide) clearInterval(this.autoSlide);
                                            this.autoSlide = null;
                                        },
                                        nextImage(auto = false) {
                                            if (this.currentImages.length <= 1) return;
                                            let slider = this.$refs.inlineImageSlider;
                                            if(!slider) return;
                                            let maxScroll = slider.scrollWidth - slider.clientWidth;
                                            if (slider.scrollLeft >= maxScroll - 10) {
                                                if(auto) slider.scrollTo({ left: 0, behavior: 'smooth' });
                                            } else {
                                                slider.scrollBy({ left: slider.clientWidth, behavior: 'smooth' });
                                            }
                                        },

                                            if(!slider) return;

                                            }
                                        },

                                            let slider = this.$refs.inlineImageSlider;
                                            if(slider) {
                                                this.activeImage = Math.round(slider.scrollLeft / slider.clientWidth);
                                            }
                                        }
                                     }"

                                                <img :src="img" :alt="linkedProduct?.name" class="relative z-10 w-full h-full object-contain transition-transform duration-700 hover:scale-105" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x800/1A112A/A78BFA?text=Img';">

    <!-- ═══════════════════════════════════════════════════

    <script>
        // ── Supabase ──────────────────────────────────────────────
        const SUPABASE_URL     = 'https://abcqnfxyaetxkzzmwkzy.supabase.co';
        const SUPABASE_ANON_KEY= 'sb_publishable_gA1sl3Z4urYWi_zwT0PMVA_KlxhubUP';
        const supabaseClient   = typeof window.supabase !== 'undefined'
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;

        // ── Alpine component ──────────────────────────────────────
        document.addEventListener('alpine:init', () => {
            Alpine.data('hubPage', () => ({

                // ── Estado ──
                isLoading:        true,
                isLoadingItems:   true,
                currentView:      'hub',   // 'hub' | 'category' | 'item'
                hub:              null,
                items:            [],      // items del nivel actual (raíces o hijos)
                currentCategory:  null,    // hub_item que actúa como categoría (nivel 2)
                currentItem:      null,    // hub_item hoja (nivel 3)
                linkedProduct:    null,    // producto de tienda asociado al item actual
                fullscreenImage:  null,    // Visor pantalla completa
                searchQuery:      '',
                filterTipo:       'todos',

                // ── Settings del sitio (para navbar/footer) ──
                settings: {
                    site_name:          localStorage.getItem('nexus_site_name')    || '',
                    site_motto:         localStorage.getItem('nexus_site_motto')   || '',
                    logo_url:           localStorage.getItem('nexus_logo_url')     || '',
                    footer_description: '',
                    whatsapp:           '',
                    email:              '',
                },

                // ── Auth ──
                authUser:        null,
                currentUserRole: null,
                userAccessMap:   {},
                isAuthModalOpen: false,
                authMode:        'login',
                authForm:        { email: '', password: '' },
                authLoading:     false,
                authError:       '',

                // ── Computed ──
                get tiposDisponibles() {
                    const tipos = [...new Set(this.items.map(i => i.tipo_item).filter(Boolean))];
                    return tipos;
                },

                get filteredItems() {
                    const q = this.searchQuery.toLowerCase().trim().replace(/[<>&'"]/g,'');
                    return this.items.filter(item => {
                        const matchSearch = !q ||
                            item.nombre?.toLowerCase().includes(q) ||
                            item.subtitulo?.toLowerCase().includes(q) ||
                            item.descripcion_breve?.toLowerCase().includes(q);
                        const matchTipo = this.filterTipo === 'todos' || item.tipo_item === this.filterTipo;
                        return matchSearch && matchTipo;
                    });
                },

                get rootItems() {
                    return this.items;
                },

                isCategory(item) {
                    return item.is_category === true;
                },

                get canAccessAdmin() {
                    return ['editor','admin','superadmin'].includes(this.currentUserRole);
                },

                // ── Init ──
                async init() {
                    this.initAuth();
                    await this.loadSettings();
                    await this.resolveHubFromURL();
                    this.applyHubAccentColor();
                    this.initParticles();
                    window.addEventListener('popstate', () => {
                        const segs = window.location.pathname.split('/').filter(Boolean);
                        if (segs.length >= 3) {
                            const catSlug  = segs[1];
                            const itemSlug = segs[2];
                            const cat  = this._allRootItems?.find(i => i.slug === catSlug) || null;
                            const item = this._allChildItems?.[cat?.id]?.find(i => i.slug === itemSlug) || null;
                            if (cat && item) { this.openItemView(item, false); return; }
                        }
                        if (segs.length === 2) {
                            const slug = segs[1];
                            const asCategory = this._allRootItems?.find(i => i.slug === slug && i.is_category);
                            if (asCategory) { this.openCategoryView(asCategory, false); return; }
                            const asItem = this._allRootItems?.find(i => i.slug === slug && !i.is_category);
                            if (asItem) { this.openItemView(asItem, false); return; }
                        }
                        this.openHubView(false);
                    });
                    setTimeout(() => { this.isLoading = false; }, 600);
                },

                async resolveHubFromURL() {
                    if (!supabaseClient) { this.isLoadingItems = false; return; }

                    const segments      = window.location.pathname.split('/').filter(Boolean);
                    const hubSlug       = segments[0] || null;
                    const seg1          = segments[1] || null;   
                    const seg2          = segments[2] || null;   
                    const hubId         = new URLSearchParams(window.location.search).get('hub_id');

                    let hubQuery = supabaseClient.from('hubs').select('*').eq('activo', true);
                    if      (hubSlug) hubQuery = hubQuery.eq('slug', hubSlug);
                    else if (hubId)   hubQuery = hubQuery.eq('id', hubId);
                    else              hubQuery = hubQuery.limit(1);

                    const { data: hubData, error: hubErr } = await hubQuery.single();

                    if (hubErr || !hubData) { this.isLoadingItems = false; return; }

                    this.hub = hubData;
                    document.title = `${hubData.nombre} | ${this.settings.site_name || 'Hub'}`;

                    await this.loadItems(hubData.id, null);
                    this._allRootItems = [...this.items];
                    this._allChildItems = {};

                    if (seg1) {
                        const asCategory = this.items.find(i => i.slug === seg1 && i.is_category === true);

                        if (asCategory && seg2) {
                            await this.loadItems(hubData.id, asCategory.id);
                            this._allChildItems[asCategory.id] = [...this.items];
                            const leafItem = this.items.find(i => i.slug === seg2);
                            if (leafItem) this.openItemView(leafItem, false);
                            else          this.openCategoryView(asCategory, false);
                        } else if (asCategory && !seg2) {
                            await this.loadItems(hubData.id, asCategory.id);
                            this._allChildItems[asCategory.id] = [...this.items];
                            this.openCategoryView(asCategory, false);
                        } else {
                            const directItem = this.items.find(i => i.slug === seg1);
                            if (directItem) this.openItemView(directItem, false);
                        }
                    }
                },

                async loadItems(hubId, parentItemId = null) {
                    this.isLoadingItems = true;
                    if (!supabaseClient) { this.isLoadingItems = false; return; }

                    let query = supabaseClient
                        .from('hub_items')
                        .select('*')
                        .eq('hub_id', hubId)
                        .eq('activo', true)
                        .order('orden', { ascending: true, nullsFirst: false })
                        .order('id',    { ascending: true });

                    if (parentItemId) {
                        query = query.eq('parent_item_id', parentItemId);
                    } else {
                        query = query.is('parent_item_id', null);
                    }

                    if (!this.canAccessAdmin) {
                        query = query.eq('estado', 'publicado');
                    }

                    const { data, error } = await query;
                    this.items = (!error && data) ? data : [];
                    this.isLoadingItems = false;
                },

                // ── Navegación entre vistas ──
                async openItemView(item, pushState = true) {
                    this.currentItem = item;
                    this.linkedProduct = null;
                    this.currentView = 'item';
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    if (pushState && this.hub) {
                        if (this.currentCategory) {
                            window.history.pushState({}, '', `/${this.hub.slug}/${this.currentCategory.slug}/${item.slug}`);
                        } else {
                            window.history.pushState({}, '', `/${this.hub.slug}/${item.slug}`);
                        }
                    }

                    if (item.seo_json?.title) document.title = item.seo_json.title;
                    else document.title = `${item.nombre} | ${this.currentCategory?.nombre || this.hub?.nombre || ''} | ${this.settings.site_name || ''}`;

                    if (item.product_id && supabaseClient) {
                        try {
                            const { data, error } = await supabaseClient
                                .from('products')
                                .select('id, name, description, price, originalPrice, stock, image, images')
                                .eq('id', item.product_id)
                                .single();
                            if (!error && data) this.linkedProduct = data;
                        } catch(e) {}
                    }
                },

                async openCategoryView(category, pushState = true) {
                    this.currentCategory = category;
                    this.currentItem     = null;
                    this.linkedProduct   = null;
                    this.currentView     = 'category';
                    this.searchQuery     = '';
                    this.filterTipo      = 'todos';
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    if (!this._allChildItems?.[category.id]) {
                        await this.loadItems(this.hub.id, category.id);
                        if (!this._allChildItems) this._allChildItems = {};
                        this._allChildItems[category.id] = [...this.items];
                    } else {
                        this.items = [...this._allChildItems[category.id]];
                    }

                    if (pushState && this.hub) {
                        window.history.pushState({}, '', `/${this.hub.slug}/${category.slug}`);
                    }
                    document.title = `${category.nombre} | ${this.hub?.nombre || ''} | ${this.settings.site_name || ''}`;
                },

                async openHubView(pushState = true) {
                    this.currentItem     = null;
                    this.currentCategory = null;
                    this.linkedProduct   = null;
                    this.currentView     = 'hub';
                    this.searchQuery     = '';
                    this.filterTipo      = 'todos';
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    if (this._allRootItems) {
                        this.items = [...this._allRootItems];
                    }

                    if (this.hub) {
                        if (pushState) window.history.pushState({}, '', `/${this.hub.slug}`);
                        document.title = `${this.hub.nombre} | ${this.settings.site_name || ''}`;
                    }
                },

                applyHubAccentColor() {
                    if (!this.hub?.color_acento) return;
                    const hex = this.hub.color_acento;
                    const c   = hex.replace('#','');
                    const rgb = `${parseInt(c.slice(0,2),16)} ${parseInt(c.slice(2,4),16)} ${parseInt(c.slice(4,6),16)}`;
                    document.documentElement.style.setProperty('--hub-accent', rgb);
                },

                // ── Helpers ──
                formatPrice(value, moneda = 'ARS') {
                    if (!value) return '';
                    const locale = moneda === 'ARS' ? 'es-AR' : 'en-US';
                    return new Intl.NumberFormat(locale, {
                        style: 'currency', currency: moneda, minimumFractionDigits: 0
                    }).format(value);
                },

                buildWhatsappLink(item) {
                    if (!this.settings.whatsapp) return '#';
                    const msg = `✨ Hola! Me interesa este item del hub *${this.hub?.nombre || ''}*:\n\n▫️ *${item.nombre}*\n${item.precio ? '💰 Precio: ' + this.formatPrice(item.precio, item.moneda) : 'A convenir'}\n\nQuedo a la espera. ¡Gracias!`;
                    return `https://wa.me/${this.settings.whatsapp}?text=${encodeURIComponent(msg)}`;
                },

                buildProductWhatsappLink(product) {
                    if (!this.settings.whatsapp) return '#';
                    const msg = `✨ Hola! Me interesa este producto asociado del hub *${this.hub?.nombre || ''}*:\n\n▫️ *${product.name}*\n💰 Precio: ${this.formatPrice(product.price, this.currentItem?.moneda || 'ARS')}\n\nQuedo a la espera. ¡Gracias!`;
                    return `https://wa.me/${this.settings.whatsapp}?text=${encodeURIComponent(msg)}`;
                },

                hasPendingSections(item) {
                    if (!item?.secciones_json) return false;
                    const sj = item.secciones_json;
                    return sj.galeria || sj.caracteristicas || sj.preview_media ||
                           sj.plan_suscripcion || sj.testimonios || sj.faq || sj.relacionados;
                },

                // ── Settings del sitio ──
                async loadSettings() {
                    if (!supabaseClient) return;
                    try {
                        const { data, error } = await supabaseClient.from('site_settings').select('*').single();
                        if (!error && data) {
                            this.settings = { ...this.settings, ...data };
                            if (data.site_name)  localStorage.setItem('nexus_site_name',  data.site_name);
                            if (data.site_motto) localStorage.setItem('nexus_site_motto', data.site_motto);
                            if (data.logo_url)   localStorage.setItem('nexus_logo_url',   data.logo_url);
                            this.applyGlobalTheme(data);
                        }
                    } catch(e) {}
                },

                applyGlobalTheme(data) {
                    const presets = {
                        default: { base:'#0D0914', surface:'#1A112A', accent:'#D4AF37', highlight:'#2D1D45' },
                        dragon:  { base:'#140505', surface:'#210A0A', accent:'#E11D48', highlight:'#331212' },
                        forest:  { base:'#05120B', surface:'#092215', accent:'#10B981', highlight:'#113623' },
                        ocean:   { base:'#050A14', surface:'#0A1326', accent:'#3B82F6', highlight:'#122240' },
                    };
                    const hexToRgb = h => {
                        if (!h) return '0 0 0';
                        let c = h.replace('#','');
                        if (c.length===3) c=c.split('').map(x=>x+x).join('');
                        return `${parseInt(c.slice(0,2),16)} ${parseInt(c.slice(2,4),16)} ${parseInt(c.slice(4,6),16)}`;
                    };
                    const t = data.theme || 'default';
                    const p = presets[t] || presets.default;
                    document.documentElement.style.setProperty('--color-base',              hexToRgb(t==='custom' ? data.color_base    || p.base    : p.base));
                    document.documentElement.style.setProperty('--color-surface',           hexToRgb(t==='custom' ? data.color_surface || p.surface : p.surface));
                    document.documentElement.style.setProperty('--color-surface-highlight', hexToRgb(p.highlight));
                    document.documentElement.style.setProperty('--color-accent',            hexToRgb(t==='custom' ? data.color_accent  || p.accent  : p.accent));
                    document.documentElement.style.setProperty('--overlay-opacity',         ((data.hero_opacity ?? 80) / 100).toString());
                },

                // ── Partículas ──
                initParticles() {
                    setTimeout(() => {
                        if (!window.tsParticles) return;
                        const accent = this.settings.color_accent || '#D4AF37';
                        tsParticles.load("tsparticles", {
                            fullScreen: { enable: false },
                            fpsLimit: 60,
                            particles: {
                                number: { value: 40, density: { enable: true, area: 900 } },
                                color:  { value: accent },
                                shape:  { type: "circle" },
                                opacity:{ value: { min: 0.05, max: 0.25 }, animation: { enable: true, speed: 1.2, sync: false } },
                                size:   { value: { min: 0.5, max: 2.5 } },
                                move:   { enable: true, speed: 0.5, direction: "none", random: true, straight: false, outModes: "out" },
                            },
                            detectRetina: true,
                        });
                    }, 800);
                },

                // ── Auth ──
                async initAuth() {
                    if (!supabaseClient) return;
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    this.authUser = session?.user || null;
                    await this.checkAdminRole();
                    await this.loadUserBookAccess();
                    supabaseClient.auth.onAuthStateChange((_event, session) => {
                        this.authUser = session?.user || null;
                        this.checkAdminRole();
                        this.loadUserBookAccess();
                        if (this.hub) {
                            const parentId = this.currentCategory?.id || null;
                            this.loadItems(this.hub.id, parentId);
                        }
                    });
                },

                async checkAdminRole() {
                    if (!supabaseClient || !this.authUser) { this.currentUserRole = null; return; }
                    try {
                        const { data, error } = await supabaseClient
                            .from('user_roles').select('role').eq('user_id', this.authUser.id);
                        this.currentUserRole = (!error && data?.length > 0) ? data[0].role : null;
                    } catch(e) { this.currentUserRole = null; }
                },

                async loadUserBookAccess() {
                    if (!supabaseClient || !this.authUser) { this.userAccessMap = {}; return; }
                    try {
                        const { data, error } = await supabaseClient
                            .from('user_book_access').select('is_vip, book_ids')
                            .eq('user_id', this.authUser.id).single();
                        this.userAccessMap = (!error && data) ? {
                            is_vip:   data.is_vip || false,
                            book_ids: Array.isArray(data.book_ids) ? data.book_ids : []
                        } : { is_vip: false, book_ids: [] };
                    } catch(e) { this.userAccessMap = { is_vip: false, book_ids: [] }; }
                },

                openAuthModal() {
                    this.authMode  = 'login';
                    this.authError = '';
                    this.authForm.password = '';
                    this.isAuthModalOpen = true;
                },

                async handleEmailAuth() {
                    this.authLoading = true;
                    this.authError   = '';
                    let error, authData;
                    if (this.authMode === 'register') {
                        ({ data: authData, error } = await supabaseClient.auth.signUp({ email: this.authForm.email, password: this.authForm.password }));
                    } else {
                        ({ data: authData, error } = await supabaseClient.auth.signInWithPassword({ email: this.authForm.email, password: this.authForm.password }));
                    }
                    this.authLoading = false;
                    if (error) {
                        if (error.message.includes('Invalid login'))         this.authError = 'Credenciales inválidas.';
                        else if (error.message.includes('already registered')) this.authError = 'Este grimorio ya pertenece al santuario.';
                        else                                                   this.authError = error.message;
                    } else {
                        if (authData?.session?.user) this.authUser = authData.session.user;
                        else if (authData?.user)     this.authUser = authData.user;
                        await this.checkAdminRole();
                        await this.loadUserBookAccess();
                        this.authForm.password = '';
                        if (this.authMode === 'register' && !authData?.session) {
                            alert('✧ Portal abierto. Revisá tu correo para confirmar tu identidad.');
                        }
                    }
                },

                async logout() {
                    await supabaseClient.auth.signOut();
                    this.authUser        = null;
                    this.currentUserRole = null;
                    this.userAccessMap   = {};
                    this.isAuthModalOpen = false;
                },

            }))
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
